name: scan-inbox

# Free scheduler for hosts that cannot poll in-process (Render free, Vercel).
# Add these repository secrets:
#   RICKY_URL    https://your-app.onrender.com
#   CRON_SECRET  the same value as the server's CRON_SECRET
#
# GitHub delays scheduled jobs under load, so treat this as "every ~5-15 min".
# For tighter timing use cron-job.org against the same URL.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: ricky-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Ricky
        env:
          RICKY_URL: ${{ secrets.RICKY_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          base="${RICKY_URL%/}"
          echo "Scanning ${base}"
          response=$(curl -sS --max-time 90 --retry 3 --retry-delay 10 \
            "${base}/api/cron/scan?key=${CRON_SECRET}")
          echo "${response}"
          echo "${response}" | grep -q '"ok":true'
