name: scan-inbox

# Manual-only workflow.
# The 5-minute schedule was removed because this app is not deployed, so every
# scheduled run failed and filled the Actions tab with red X's.
# Trigger it by hand from the Actions tab once a host is actually live.
#
# If you deploy later, add these repository secrets:
#   RICKY_URL    https://your-app.onrender.com
#   CRON_SECRET  the same value as the server's CRON_SECRET
# and restore the schedule:
#   on:
#     schedule:
#       - cron: "*/5 * * * *"
#     workflow_dispatch:
on:
  workflow_dispatch:

concurrency:
  group: ricky-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Ricky
        env:
          RICKY_URL: ${{ secrets.RICKY_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${RICKY_URL:-}" ]; then
            echo "::notice::RICKY_URL secret is not set - nothing to scan. Skipping."
            exit 0
          fi
          base="${RICKY_URL%/}"
          echo "Scanning ${base}"
          response=$(curl -sS --max-time 90 --retry 3 --retry-delay 10 \
            "${base}/api/cron/scan?key=${CRON_SECRET}")
          echo "${response}"
          echo "${response}" | grep -q '"ok":true'
